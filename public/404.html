<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/horizon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Poppins:wght@400;700;800&display=swap"
    rel="stylesheet"
    />
    <title>Training Platform</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: this 404.html file must be at least 512 bytes for it to work
      // with Internet Explorer (it is currently > 512 bytes)

      // If you're creating a Project Pages site and NOT using a custom domain,
      // then set pathSegmentsToKeep to 1 (enterprise users may need to set it to > 1).
      // This way the code will only replace the route part of the path, and not
      // the real directory in which the app resides, for example:
      // https://username.github.io/repo-name/one/two?a=b&c=d#qwe becomes
      // https://username.github.io/repo-name/?/one/two&a=b~and~c=d#qwe
      // Otherwise, leave pathSegmentsToKeep as 0.
      // Auto-detect:
      // - GitHub Pages project site: keep 1 segment (/training-platform/)
      // - Cloudflare Pages (root): keep 0 (so app runs at /#/...)
      var l = window.location;
      var isGithubPages = /\.github\.io$/i.test(l.hostname);
      var pathSegmentsToKeep = isGithubPages ? 1 : 0;

      // Normalize hash (avoid legacy /#/#/...)
      var rawHash = l.hash || '';
      if (rawHash.indexOf('#/#/') === 0) {
        rawHash = '#/' + rawHash.slice(4);
      }

      // Split pathname into segments
      var pathSegments = l.pathname.split('/').filter(function (s) { return s !== ''; });

      // Cloudflare: if someone hits /training-platform/... by mistake, strip it
      // so we redirect to root /#/...
      if (!isGithubPages && pathSegments.length > 0 && pathSegments[0] === 'training-platform') {
        pathSegments = pathSegments.slice(1);
      }

      // Build base (keep first N segments)
      var basePath = pathSegments.slice(0, pathSegmentsToKeep).join('/');
      var base = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (basePath ? '/' + basePath + '/' : '/');

      // Decide target hash:
      // - If already a HashRouter route (#/...), keep it (do NOT append another #/)
      // - Otherwise convert pathname (minus basePath) into a hash route and preserve query
      var targetHash;
      if (rawHash.indexOf('#/') === 0) {
        targetHash = rawHash;
      } else {
        var remainingSegments = pathSegments.slice(pathSegmentsToKeep);
        targetHash = (remainingSegments.length > 0 ? '#/' + remainingSegments.join('/') : '#/') + (l.search || '');
      }

      // Always redirect to ensure index.html is loaded (not this 404.html)
      var newUrl = base + targetHash;
      console.log('Redirecting from 404 to:', newUrl);
      l.replace(newUrl);
    </script>
  </head>
  <body>
  </body>
</html>
